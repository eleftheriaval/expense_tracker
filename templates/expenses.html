<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='expenses.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">


</head>
<body>

{% include 'navbar.html' %}

   <h1 class="welcomeText">Your expenses:</h1>
<table>
  <tr>
    <th>Description</th>
    <th>Date</th>
    <th>Amount</th>
    <th>Category</th>
  </tr>
  {% for expense in result_expenses %}
  <tr>
    <th>{{expense[0]}}</th>
    <th>{{expense[1]}}</th>
    <th>{{expense[2]}}</th>
    <th>{{expense[3]}}</th>
  </tr>
  {% endfor %}
</table>


<div class="addExpense" id="addExpense">
  <form id="addExpenseForm" method="POST" action="{{ url_for('expenses') }}">
   <input type="text" id="expenseDescription" class="input-box" name="description" placeholder="Description" required>
   <input type="date" id="expenseDate" class="input-box" name="date" placeholder="Date" required>
   <input type="number" step="0.01" min="0" id="expenseAmount" class="input-box" name="amount" placeholder = "Amount" required>
   <input type="text" id="expenseCategory" class="input-box" name="category" placeholder = "Category">
   <button id="addButton" class="addButton">Add</button>
  </form>
</div>



</body>
</html>
