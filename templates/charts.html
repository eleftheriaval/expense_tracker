<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='charts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

{% include 'navbar.html' %}

<h1 class="welcomeText">Select the chart you want to see:</h1>
<div id="dropdown" class="dropdown">
      <select onchange = "selectChart(this.value)">
        <option value="" selected disabled>Select a type of chart</option>
        <option value="categoryChart">Expenses by category</option>
        <option value="monthlyChart">Expenses by month</option>
        <option value="yearlyChart">Expenses by year</option>
      </select>

       <select id="selectYear" style="display:none" onchange = "loadMonthlyBarChart(this.value)">
       </select>
</div>

<div class = "charts">
<canvas id="categoryPieChart" style="display: none"></canvas>
<canvas id="yearlyBarChart" style="display: none"></canvas>
<canvas id="monthlyBarChart" style="display: none"></canvas>
</div>

<script src ="{{ url_for('static', filename='charts.js') }}"></script>

</body>
</html>
