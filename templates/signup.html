<!DOCTYPE html>
<html lang="en">
<head>

<meta http-equiv="content-type" content="text/html;charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
<title>Expense Tracker</title>

</head>
<body>

<div class="signup">
   <h1> Sign Up</h1>
   <form id = "signUpForm" method="POST" action="{{ url_for('signup') }}">
   <input type="text" class="input-box" placeholder="Username" name="username" required>
   <input type="password" class="input-box" placeholder="Password" name="password" required>
   <input type="email" class="input-box" placeholder="Email" name="email" required>
   <input type="text" class="input-box" placeholder="First Name" name="firstName" required>
   <input type="text" class="input-box" placeholder="Surname" name="surname" required>
   <button type="submit" class="signUpCheckButton">Sign Up</button>
   </form>

   {% if(result == "fail") %}
      <p class="failMessage">Username already exists!</p>
   {% endif %}
</div>

If you have already an account, you can log in <a href="{{ url_for('login') }}">here</a>


</body>
</html>
